# Clip rules engine thresholds. Design: docs/rules-engine.md
# Edit freely, then check with:  uv run pipeline replay --start 4500 --end 6000

baseline_seconds: 60        # loudness is compared with this much recent audio
segment_seconds: 2

shot:                       # used once the MediaPipe signals exist (placeholders today)
  wide_min_people: 8
  closeup_face_share: 0.05
  crowd_max_green: 0.15

arm:
  buildup_loud_rise: 1.0    # loud_z rise over 4s, wide (or unknown) shot
  setpiece_whistle: 0.5
  setpiece_min_people: 10
  setpiece_still: 0.7
  setpiece_hold_seconds: 4
  voice_rise: 1.5           # voice_z above this for one segment
  max_lookback_seconds: 20
  expire_seconds: 15

trigger:
  threshold: 0.45
  consecutive_segments: 2
  # Broadcast audio is compressed: a goal reaches loud_z ~1.5-2, but stays up for 10s+.
  weights: {loud: 0.25, sustained: 0.25, cheer: 0.15, voice: 0.15, silence: 0.20, reaction: 0.15, armed: 0.10}
  loud_range: [0.5, 2.0]    # loud_z mapped to 0..1 across this range
  voice_range: [0.5, 2.0]
  sustained_loud_z: 1.0     # "sustained" = share of the last sustained_seconds with loud_z above this
  sustained_seconds: 8
  silence_drop: 2.0         # loud_z fall within 4s that counts as "the home crowd went quiet"
  silence_memory_seconds: 10  # a quiet spell this recent still counts when the noise comes
  reaction_window_seconds: 6

close:
  calm_loud_z: 0.5          # play has restarted once loudness is back under this...
  calm_seconds: 4           # ...for this long

clip:
  quick_before: 8
  quick_after: 4
  full_min: 20
  full_max: 40
  cooldown_seconds: 20

skip_event_types: [substitution, none]

safety_net:
  enabled: true
  every_seconds: 300
  window_seconds: 300
  match_within_seconds: 20
  # Only these become clips (a 5-minute test found 9 events, mostly fouls and tackles)
  clip_event_types: [goal, shot_on_target, save, big_chance, skill, penalty, card, celebration]

buffer_seconds: 360         # keep 6 minutes of feed for the safety net
