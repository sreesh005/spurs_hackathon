[project]
name = "pipeline"
version = "0.1.0"
description = "Spurs highlight enrichment: live video -> TwelveLabs -> ScorePlay"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "mediapipe>=1.1.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
pipeline = "pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
